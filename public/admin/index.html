<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Websitebeheer | La Reine Coaching</title>
  <link rel="stylesheet" href="./admin.css">
  <script type="module" src="./admin.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="../">La Reine Coaching</a>
      <a href="../" target="_blank" rel="noopener">Bekijk website</a>
    </div>
  </header>
  <main class="wrap">
    <h1>Websitebeheer</h1>
    <p id="status" role="status" aria-live="polite">Beheer laden…</p>

    <form id="login" class="panel login" hidden>
      <h2>Inloggen</h2>
      <label>Gebruikersnaam <input name="username" autocomplete="username" required></label>
      <label>Wachtwoord <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Inloggen</button>
    </form>

    <section id="editor" aria-label="Inhoud bewerken" hidden>
      <div class="bar session">
        <p id="draft-status">Geen wijzigingen</p>
        <button type="button" id="logout" class="secondary">Uitloggen</button>
      </div>
      <fieldset id="fields" aria-label="Website-inhoud">
        <div class="panel filters">
          <label>Onderdeel <select id="section"></select></label>
          <label id="search-label">Zoek in teksten
            <input id="search" type="search" placeholder="Zoek een woord of zin">
          </label>
        </div>
        <div id="entries" class="entries"></div>
      </fieldset>
      <div class="publish-bar">
        <button type="button" id="publish" disabled>Wijzigingen publiceren</button>
      </div>
    </section>
  </main>
</body>
</html>
